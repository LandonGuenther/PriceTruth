services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pricetruth
      POSTGRES_PASSWORD: pricetruth
      POSTGRES_DB: pricetruth
    volumes:
      - pricetruth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricetruth -d pricetruth"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pricetruth:pricetruth@db:5432/pricetruth
      HOST: 0.0.0.0
      LOG_LEVEL: info

volumes:
  pricetruth-db:
