name: staging-jobs

# Runs idempotent batch jobs against the deployed Fly staging API machine.
# Requires repository secrets:
#   FLY_API_TOKEN
#   FLY_APP_NAME   (defaults to pricetruth-api-staging if unset via env below)
on:
  schedule:
    # Rollup once daily (06:12 UTC)
    - cron: "12 6 * * *"
    # Archive once daily (07:12 UTC)
    - cron: "12 7 * * *"
    # Best Buy known-listing refresh every 6 hours (offset from canary)
    - cron: "42 */6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        default: "rollup"
        type: choice
        options:
          - rollup
          - archive
          - bestbuy-refresh

permissions:
  contents: read

jobs:
  run-job:
    runs-on: ubuntu-latest
    if: ${{ secrets.FLY_API_TOKEN != '' }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ secrets.FLY_APP_NAME }}
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Select job
        id: select
        run: |
          set -u
          app="${FLY_APP:-pricetruth-api-staging}"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          job="${{ github.event.inputs.job }}"
          if [ -z "$job" ]; then
            minute=$(date -u +%M)
            hour=$(date -u +%H)
            # cron routes: 06:12 rollup, 07:12 archive, *:42 bestbuy-refresh
            if [ "$minute" = "12" ] && [ "$hour" = "06" ]; then
              job=rollup
            elif [ "$minute" = "12" ] && [ "$hour" = "07" ]; then
              job=archive
            else
              job=bestbuy-refresh
            fi
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "selected job: $job on $app"

      - name: Execute job on Fly machine
        run: |
          set -u
          job="${{ steps.select.outputs.job }}"
          app="${{ steps.select.outputs.app }}"
          # Machine WORKDIR is /app/apps/api (see Dockerfile).
          case "$job" in
            rollup)
              cmd='pnpm jobs rollup'
              ;;
            archive)
              cmd='pnpm jobs archive'
              ;;
            bestbuy-refresh)
              cmd='pnpm jobs bestbuy-refresh --min-age-hours 6 --max-listings 200'
              ;;
            *)
              echo "unknown job: $job"; exit 1
              ;;
          esac
          flyctl ssh console -a "$app" -C "$cmd"
