name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pricetruth
          POSTGRES_PASSWORD: pricetruth
          POSTGRES_DB: pricetruth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pricetruth -d pricetruth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pricetruth:pricetruth@localhost:5432/pricetruth

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Phase 2: run `pnpm --filter @pricetruth/api exec prisma generate` and
      # `pnpm --filter @pricetruth/api exec prisma migrate deploy` here, once
      # the API package and Prisma schema exist.

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
