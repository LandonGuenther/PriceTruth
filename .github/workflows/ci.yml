name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pricetruth
          POSTGRES_PASSWORD: pricetruth
          POSTGRES_DB: pricetruth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pricetruth -d pricetruth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pricetruth:pricetruth@localhost:5432/pricetruth

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @pricetruth/api exec prisma generate
      - run: pnpm --filter @pricetruth/api exec prisma migrate deploy

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Validate migrations replay cleanly (shadow DB diff)
        run: |
          PGPASSWORD=pricetruth psql -h localhost -U pricetruth -d pricetruth \
            -c 'DROP DATABASE IF EXISTS pricetruth_shadow' \
            -c 'CREATE DATABASE pricetruth_shadow'
          pnpm --filter @pricetruth/api exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://pricetruth:pricetruth@localhost:5432/pricetruth_shadow \
            --exit-code

      - name: Check docs/openapi.json is regenerated
        run: |
          pnpm --filter @pricetruth/api openapi
          git diff --exit-code docs/openapi.json

      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t pricetruth-api:ci .

      - name: Audit production dependencies (high severity)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
