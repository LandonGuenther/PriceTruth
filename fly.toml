# PriceTruth API staging on Fly.io.
# App name may be overridden at create time if taken.
# Region iad is near Neon us-east-1.

app = "pricetruth-api-staging"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  # Apply migrations before traffic switches to the new release.
  release_command = "pnpm exec prisma migrate deploy"
  release_command_timeout = "5m"

[env]
  NODE_ENV = "staging"
  HOST = "0.0.0.0"
  PORT = "3000"
  LOG_LEVEL = "info"
  TRUST_PROXY = "true"
  ARCHIVE_BACKEND = "local"
  ARCHIVE_LOCAL_DIR = "/data/archive"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
    headers = { X-Forwarded-Proto = "https" }

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1

[processes]
  app = "node dist/src/server.js"

[[mounts]]
  source = "pricetruth_archive"
  destination = "/data"
  initial_size = "1gb"
