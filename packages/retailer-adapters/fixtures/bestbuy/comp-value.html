<!--
  Comp. Value must be captured as reference, never as the customer price.
-->
<!doctype html>
<html lang="en">
  <head>
    <title>Acme Comp Value Speaker - Best Buy</title>
  </head>
  <body>
    <h1>Acme Comp Value Speaker</h1>
    <div class="pr-200 inline-block">SKU: <!-- -->6509988</div>
    <div data-testid="LARGE_profile">
      <div data-testid="price-block">
        <div data-testid="price-block-customer-price">
          <span class="sr-only">$149.99</span>
        </div>
        <div data-testid="price-block-regular-price">
          <span class="sr-only">The comparable value is </span>
          <span data-lu-target="comp_value">$199.99</span>
        </div>
      </div>
    </div>
    <button data-testid="pdp-add-to-cart-6509988" type="button">Add to cart</button>
  </body>
</html>
