<!--
  Trimmed hand-built fixture modeled on Best Buy's product-page markup: sold
  out but the price is still shown. NOT a captured page.
-->
<!doctype html>
<html>
  <body>
    <div class="pdp" data-sku-id="6509655">
      <h1>Acme Sold Out Console</h1>
    </div>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Acme Game Console",
        "sku": "6509655",
        "offers": {
          "@type": "Offer",
          "price": "499.99",
          "availability": "https://schema.org/OutOfStock"
        }
      }
    </script>
  </body>
</html>
