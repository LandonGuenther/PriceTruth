<!doctype html>
<!--
  Trimmed capture of the new-format reviews sub-page
  /product/<slug>/JJGCQ88C8X/sku/10129617/reviews — no JSON-LD Product, no "SKU:"
  label (identity comes from the /sku/ URL segment), but the listing's own
  price block is still rendered above the reviews.
-->
<html lang="en">
  <head>
    <title>
      Apple AirPods Pro 2, Wireless Active Noise Cancelling Earbuds with Hearing
      Aid Feature White - Best Buy
    </title>
  </head>
  <body>
    <h1>Ratings &amp; Reviews</h1>

    <div data-testid="LARGE_profile">
      <div data-testid="price-block">
        <div data-testid="price-block-customer-price">
          <span class="sr-only">$238.99</span><span aria-hidden="true">$</span
          ><span aria-hidden="true">238</span><span aria-hidden="true">99</span>
        </div>
        <div data-testid="price-block-savings">
          <div data-testid="price-block-regular-price">
            <span class="sr-only">The comparable value is </span
            ><span class="whitespace-nowrap"
              ><span aria-hidden="true">Comp. Value:<!-- --> </span><span
                data-lu-target="comp_value"
                >$274.99</span
              ></span
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
