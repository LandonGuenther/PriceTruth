<!--
  Coupon-only: a savings amount appears where a price selector would match, but
  the copy is coupon savings. Prefer no_price over treating the coupon as price.
  NOT a captured page; no personal data.
-->
<!doctype html>
<html>
  <body>
    <div id="dp" data-asin="B0COUPONLY">
      <span id="productTitle">Acme Demo Coupons Widget</span>
      <div id="promoPriceBlockMessage_feature_div" class="promoPriceBlockMessage">
        <span id="vpcButton" class="couponBadge">Clip coupon</span>
      </div>
      <div id="corePrice_feature_div">
        <span class="a-price"
          ><span class="a-offscreen">$5.00</span> with coupon</span
        >
        <span class="a-size-base a-color-secondary">
          To see our price, add this item to your cart.
        </span>
      </div>
      <div id="availability">In Stock</div>
    </div>
  </body>
</html>
