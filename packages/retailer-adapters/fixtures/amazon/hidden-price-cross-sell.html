<!--
  Trimmed hand-built fixture modeled on an Amazon page where the product's
  price is gated behind add-to-cart ("To see our price, add this item to your
  cart.") while a cross-sell carousel still renders split prices for other
  ASINs. NOT a captured page.
-->
<!doctype html>
<html>
  <body>
    <div id="dp" data-asin="B09B8V1LZ3">
      <span id="productTitle">Echo Dot (5th Gen)</span>
      <div id="centerCol">
        <div id="corePrice_feature_div">
          <span class="a-size-base a-color-secondary">
            To see our price, add this item to your cart.
          </span>
        </div>
        <div id="availability">In Stock</div>
      </div>
      <div id="desktop_buybox">
        <div id="buybox">
          <input id="add-to-cart-button" type="submit" value="Add to Cart" />
        </div>
      </div>
      <div id="sims-consolidated-2_feature_div">
        <ul>
          <li data-asin="B0GGTRSMKP">
            <a class="a-link-normal" href="/dp/B0GGTRSMKP">
              <span class="a-price">
                <span class="a-price-whole">49<span class="a-price-decimal">.</span></span>
                <span class="a-price-fraction">99</span>
              </span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
