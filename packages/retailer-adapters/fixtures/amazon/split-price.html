<!--
  Trimmed hand-built fixture modeled on Amazon's markup where the price is
  rendered as separate whole/fraction spans with no .a-offscreen copy.
  NOT a captured page.
-->
<!doctype html>
<html>
  <body>
    <div id="dp" data-asin="B0SPLITPRX">
      <span id="productTitle">Acme Split Price Lamp</span>
      <span class="a-price">
        <span class="a-price-whole">199<span class="a-price-decimal">.</span></span>
        <span class="a-price-fraction">95</span>
      </span>
      <div id="availability">In Stock</div>
    </div>
  </body>
</html>
