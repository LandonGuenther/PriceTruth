<!--
  Sanitized fixture: "See all buying options" wall with no clear buy-box price.
  Other-seller / OLP / AOD prices must not be adopted as the customer price.
-->
<!doctype html>
<html>
  <body>
    <div id="dp" data-asin="B0ALLBUYOP">
      <input type="hidden" id="ASIN" value="B0ALLBUYOP" />
      <span id="productTitle">Acme Buying Options Wall Camera</span>

      <div id="corePriceDisplay_desktop_feature_div">
        <span class="a-color-price a-text-bold">See all buying options</span>
      </div>

      <div id="buybox-see-all-buying-options">
        <a id="buybox-see-all-offers-button" href="#aod">See All Buying Options</a>
      </div>

      <div id="olp_feature_div" class="olp-feature">
        <span>Other sellers on Amazon</span>
        <span class="a-price"><span class="a-offscreen">$44.50</span></span>
        <span class="a-price"><span class="a-offscreen">$39.99</span></span>
      </div>

      <div id="aod-container" class="aod-container" data-csa-c-content-id="all-offers-display">
        <div class="aod-offer">
          <span class="a-price"><span class="a-offscreen">$52.00</span></span>
        </div>
        <div class="aod-offer">
          <span class="a-price"><span class="a-offscreen">$47.25</span></span>
        </div>
      </div>

      <div id="availability">See all buying options</div>
    </div>
  </body>
</html>
