<!--
  Trimmed hand-built fixture modeled on Amazon's current product-page markup
  (corePriceDisplay_desktop_feature_div with priceToPay + basisPrice).
  NOT a captured page  -  intended to be replaced by real captures where possible.
-->
<!doctype html>
<html>
  <body>
    <div id="dp" data-asin="B0DEMOASIN">
      <input type="hidden" id="ASIN" value="B0DEMOASIN" />
      <span id="productTitle">Acme Demo Widget 3000</span>
      <a id="bylineInfo">Visit the Acme Store</a>

      <div id="corePriceDisplay_desktop_feature_div">
        <span class="basisPrice"><span class="a-size-small">List Price:</span>
          <span class="a-offscreen">$499.00</span></span>
        <span class="priceToPay"><span class="a-offscreen">$299.00</span></span>
      </div>
      <div id="corePrice_feature_div">
        <span class="a-price"><span class="a-offscreen">$299.00</span></span>
        <span class="basisPrice"><span class="a-offscreen">$499.00</span></span>
      </div>
      <div id="apex_desktop"><span class="priceToPay"><span class="a-offscreen">$299.00</span></span></div>
      <div id="corePrice_desktop"><span class="a-price"><span class="a-offscreen">$299.00</span></span></div>

      <div id="availability">In Stock</div>

      <div id="productOverview_feature_div">
        <table>
          <tr><td>Brand</td><td>Acme</td></tr>
          <tr><td>Model Name</td><td>Widget 3000</td></tr>
          <tr><td>Item model number</td><td>AC-3000</td></tr>
        </table>
      </div>

      <div id="detailBullets_feature_div">
        <ul id="detailBullets">
          <li><span>ASIN : B0DEMOASIN</span></li>
          <li><span>Item model number : AC-3000</span></li>
        </ul>
      </div>

      <div id="twister">
        <div id="variation_size_name">
          <label class="a-form-label">Size:</label>
          <span class="selection">Large</span>
        </div>
      </div>
    </div>
  </body>
</html>
