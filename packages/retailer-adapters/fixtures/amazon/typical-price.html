<!--
  Trimmed hand-built fixture modeled on Amazon's markup: reference price shown
  as "Typical price:" via the corePrice_feature_div basisPrice block.
  NOT a captured page.
-->
<!doctype html>
<html>
  <body>
    <div id="dp" data-asin="B0TYPICALX">
      <span id="productTitle">Acme Kettle</span>
      <div id="corePrice_feature_div">
        <span class="basisPrice"><span class="a-size-small">Typical price:</span>
          <span class="a-offscreen">$59.99</span></span>
        <span class="a-price"><span class="a-offscreen">$44.99</span></span>
      </div>
      <span id="listPrice">$59.99</span>
      <div id="availability">Only 4 left in stock - order soon. In Stock</div>
    </div>
  </body>
</html>
