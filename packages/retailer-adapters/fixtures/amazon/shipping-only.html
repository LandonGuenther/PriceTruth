<!--
  Shipping fee sits under a core price selector path. Prefer no_price over
  treating shipping as the product price.
  NOT a captured page; no personal data.
-->
<!doctype html>
<html>
  <body>
    <div id="dp" data-asin="B0SHIPONLY">
      <span id="productTitle">Acme Desk Lamp</span>
      <div id="corePrice_feature_div">
        <div id="deliveryBlockMessage" class="shipping-message">
          <span id="mir-layout-DELIVERY_BLOCK" data-csa-c-delivery-price="true">
            <span class="a-price"><span class="a-offscreen">$5.99</span></span>
            shipping
          </span>
        </div>
        <span class="a-size-base a-color-secondary">
          To see our price, add this item to your cart.
        </span>
      </div>
      <div id="availability">In Stock</div>
    </div>
  </body>
</html>
