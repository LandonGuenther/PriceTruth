<!--
  Real-page structure (B00MNV8E0C, 2026-09-18): buy-box price hidden behind
  add-to-cart; the only price-looking text is a display:none Subscribe & Save
  tier label "$13.00 with 15 percent savings" plus a per-count unit price.
  The hidden SnS tier must never be adopted as the pack price.
  NOT a captured page.
-->
<!doctype html>
<html>
  <body>
    <div id="dp" data-asin="B00MNV8E0C">
      <span id="productTitle">Amazon Basics 48-Pack AA Batteries</span>
      <input id="ASIN" type="hidden" value="B00MNV8E0C" />
      <div id="corePrice_feature_div">
        <div id="sns-tiered-price" class="aok-hidden">
          <span class="a-price"
            ><span class="a-offscreen apex-pricetopay-accessibility-label">$13.00</span
            ><span>with 15 percent savings</span></span
          >
        </div>
        <span class="apex-priceperunit-value"
          ><span class="a-price"
            ><span class="a-offscreen">$0.27</span
            ><span class="a-price-whole">0<span class="a-price-decimal">.</span></span
            ><span class="a-price-fraction">27</span></span
          >
          <span>per Count</span></span
        >
        <span class="a-size-base a-color-secondary">
          To see product details, add this item to your cart.
        </span>
      </div>
      <div id="availability">In Stock</div>
    </div>
  </body>
</html>
