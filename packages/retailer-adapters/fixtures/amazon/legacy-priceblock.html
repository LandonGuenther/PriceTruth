<!--
  Trimmed hand-built fixture modeled on Amazon's legacy markup:
  #priceblock_ourprice as the price and a struck-through sibling as reference.
  NOT a captured page.
-->
<!doctype html>
<html>
  <body>
    <div id="dp" data-asin="B0LEGACYPR">
      <span id="productTitle">Acme Legacy Mouse</span>
      <span id="priceblock_ourprice">$24.99</span>
      <span class="a-text-strike">$39.99</span>
      <span id="priceblock_dealprice">$24.99</span>
      <div id="availability">In Stock</div>
    </div>
  </body>
</html>
